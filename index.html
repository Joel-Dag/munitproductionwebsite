    <script>
      // Early fetch patch guard: prevent polyfills or scripts from throwing
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return customFetch; },
            set: function(fn) { customFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
